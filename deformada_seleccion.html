<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Seleccionar vigas sospechosas (deformada)</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: monospace; }
  #info {
    position: absolute; top: 10px; left: 10px;
    color: #0f0; background: rgba(0,0,0,0.7);
    padding: 10px 15px; border-radius: 5px; font-size: 13px;
    z-index: 10; max-width: 460px; line-height: 1.5;
  }
  #panel {
    position: absolute; top: 10px; right: 10px;
    width: 300px; max-height: calc(100vh - 40px); overflow-y: auto;
    color: #fff; background: rgba(0,0,0,0.85);
    padding: 10px 14px; border-radius: 6px; font-size: 12px;
    z-index: 10; border: 1px solid #0aa;
  }
  #panel h3 { margin: 0 0 6px; color: #0ff; font-size: 13px; }
  #panel select, #panel input[type=range] {
    background: #111; color: #0ff; border: 1px solid #0aa; border-radius: 3px;
    font-family: monospace; font-size: 12px; padding: 1px 4px;
  }
  #panel .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
  #panel label { color: #9ff; }
  #panel button {
    background: #2d6f2d; color: #fff; border: none; border-radius: 4px;
    padding: 4px 8px; cursor: pointer; font-family: monospace; font-size: 11px;
  }
  #panel button.reg { background: #c27b0f; }
  #panel button.danger { background: #8b2f2f; }
  #selList { max-height: 260px; overflow-y: auto; margin-top: 6px;
             border: 1px solid #333; padding: 4px; font-size : 11px; }
  #selList div { padding: 1px 2px; color: #ddd; }
  #selList .rm { color: #f66; cursor: pointer; margin-right: 6px; }
  #hoverInfo {
    position: absolute; bottom: 10px; left: 10px;
    color: #0ff; background: rgba(0,0,0,0.75);
    padding: 8px 12px; border-radius: 5px; font-size: 12px; z-index: 10;
  }
  #count { color: #ffd700; font-weight: bold; }
</style>
</head>
<body>
<div id="info">
  <b>Seleccion de vigas sospechosas</b> (deformada, modelo global)<br>
  Izq: rotar | Der: mover | Scroll: zoom | <b>Clic en un elemento</b>: marcar / desmarcar<br>
  Solo se muestra la deformada; el wireframe es la geometria original de referencia.
</div>

<div id="panel">
  <h3>Control</h3>
  <div class="row"><label>Caso: <select id="selCaso"></select></label></div>
  <div class="row"><label>Escala: <input type="range" id="rngFac" min="10" max="600" step="5" value="120">
    <span id="facVal">120x</span></label></div>
  <div class="row">
    <label><input type="checkbox" checked id="tg-col"> Columnas</label>
    <label><input type="checkbox" checked id="tg-bx"> Vigas X</label>
    <label><input type="checkbox" checked id="tg-by"> Vigas Y</label>
    <label><input type="checkbox" checked id="tg-wall"> Muros</label>
  </div>
  <div class="row">
    <button onclick="copySel()">Copiar JSON</button>
    <button onclick="downloadSel()">Descargar</button>
    <button class="reg" onclick="switchMode()">Ref/Def</button>
    <button class="danger" onclick="clearSel()">Limpiar</button>
  </div>
  <div class="row">Seleccionadas: <span id="count">0</span></div>
  <div id="selList"></div>
</div>

<div id="hoverInfo">Hover sobre un elemento para ver su id</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="resultados/11_mapa_visor/analysis_map.js"></script>
<script src="resultados/11_mapa_visor/deformada_elements.js"></script>
<script>
const ANALYSIS = (typeof ANALYSIS_MAP !== 'undefined') ? ANALYSIS_MAP : null;
const CASES = ANALYSIS ? ANALYSIS.casos : ['G','Q','EX','EY','COMBO'];
const selCaso = document.getElementById('selCaso');
CASES.forEach(c => {
  const o = document.createElement('option');
  o.value = c; o.textContent = c;
  selCaso.add(o);
});
selCaso.value = 'EX';

let S = { caso: 'EX', factor: 120, showRef: true };

// ---------- escena ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 1000);
const ORBIT_TARGET = new THREE.Vector3(-3.6, 3.56, 10);
camera.position.set(-25, 30, 50);
camera.lookAt(ORBIT_TARGET);

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const ambLight = new THREE.AmbientLight(0x404060, 0.6);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);
const hemiLight = new THREE.HemisphereLight(0x8888aa, 0x444422, 0.4);
scene.add(hemiLight);
const gridHelper = new THREE.GridHelper(30, 30, 0x444466, 0x333355);
gridHelper.position.y = 0;
scene.add(gridHelper);
const axesHelper = new THREE.AxesHelper(3);
axesHelper.position.set(0, 0, 0);
scene.add(axesHelper);

// ---------- geometria de referencia (wireframe tenue) ----------
const refGroup = new THREE.Group();
const refMat = new THREE.LineBasicMaterial({color: 0x777788, transparent: true, opacity: 0.30});
elements.forEach(e => {
  if (e.type === 'loza') return;
  const pts = [
    new THREE.Vector3(e.xi, e.yi, e.zi),
    new THREE.Vector3(e.xj, e.yj, e.zj)
  ];
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  refGroup.add(new THREE.Line(g, refMat));
});
scene.add(refGroup);

// ---------- grupo de deformada ----------
const defGroup = new THREE.Group();
scene.add(defGroup);
const heat = (t) => {
  const r = Math.min(1, Math.max(0, t));
  if (r < 0.5) return new THREE.Color(0x0033ff).lerp(new THREE.Color(0x33ffcc), r * 2);
  return new THREE.Color(0x33ffcc).lerp(new THREE.Color(0xff2222), (r - 0.5) * 2);
};
const SEL_COLOR = new THREE.Color(0xffff00);
const metaIdx = [];   // ix -> {e, meta}
const defMeshes = []; // {mesh, ix}

function buildDeformada() {
  while (defGroup.children.length) {
    const c = defGroup.children.pop();
    c.geometry && c.geometry.dispose();
  }
  defMeshes.length = 0;
  if (!ANALYSIS) { alert('Sin analysis_map.js'); return; }
  const D = ANALYSIS.disp[S.caso] || {};
  let dmax = 0;
  for (const t in D) {
    const du = D[t];
    const dL = Math.hypot(du[0], du[1], du[2]);
    if (dL > dmax) dmax = dL;
  }
  if (dmax < 1e-12) dmax = 1;

  const active = {
    column: document.getElementById('tg-col').checked,
    beam_x: document.getElementById('tg-bx').checked,
    beam_y: document.getElementById('tg-by').checked,
    wall: document.getElementById('tg-wall').checked,
  };
  const fac = S.factor;
  const NC = ANALYSIS.node_coords || {};
  for (let ix = 0; ix < elements.length; ix++) {
    const e = elements[ix];
    if (e.type === 'loza') continue;
    if (!active[e.type]) continue;
    const meta = ANALYSIS.elements[ix];
    if (!meta || !meta.ni) continue;
    const fracs = (ANALYSIS.beam_fractions && ANALYSIS.beam_fractions[meta.id]) || null;
    let segs;
    if (fracs && fracs.length) {
      segs = [];
      for (const fr of fracs) {
        const ci = NC[fr.ni], cj = NC[fr.nj];
        const di = (D[String(fr.ni)] || D[fr.ni] || [0,0,0,0,0,0]);
        const dj = (D[String(fr.nj)] || D[fr.nj] || [0,0,0,0,0,0]);
        const p0 = ci ? [ci[0] + di[0]*fac, ci[2] + di[2]*fac, ci[1] + di[1]*fac]
                      : [e.xi, e.yi, e.zi];
        const p1 = cj ? [cj[0] + dj[0]*fac, cj[2] + dj[2]*fac, cj[1] + dj[1]*fac]
                      : [e.xj, e.yj, e.zj];
        segs.push([p0, p1]);
      }
    } else {
      const di = D[meta.ni] || [0,0,0,0,0,0];
      const dj = D[meta.nj] || [0,0,0,0,0,0];
      segs = [[
        [e.xi + di[0]*fac, e.yi + di[2]*fac, e.zi + di[1]*fac],
        [e.xj + dj[0]*fac, e.yj + dj[2]*fac, e.zj + dj[1]*fac],
      ]];
    }
    const L0 = Math.hypot(e.xj - e.xi, e.yj - e.yi, e.zj - e.zi);
    const des = (D[meta.ni] ? Math.hypot(D[meta.ni][0], D[meta.ni][1], D[meta.ni][2]) : 0);
    const color = selected.has(ix) ? SEL_COLOR : heat(Math.min(1, des / (dmax*0.85)));
    for (const [p0, p1] of segs) {
      const L = Math.hypot(p1[0]-p0[0], p1[1]-p0[1], p1[2]-p0[2]);
      if (L < 1e-9) continue;
      const geo = new THREE.CylinderGeometry(0.12, 0.12, L, 6, 1, true);
      const mat = new THREE.MeshPhongMaterial({color: color, emissive: (selected.has(ix) ? 0x442200 : 0x000000)});
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set((p0[0]+p1[0])/2, (p0[1]+p1[1])/2, (p0[2]+p1[2])/2);
      const dx = p1[0]-p0[0], dy = p1[1]-p0[1], dz = p1[2]-p0[2];
      const len = Math.hypot(dx, dy, dz) || 1e-9;
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0,1,0),
        new THREE.Vector3(dx/len, dy/len, dz/len)
      );
      mesh.userData = { ix: ix, id: meta.id, type: e.type, section: e.section };
      defGroup.add(mesh);
      defMeshes.push({mesh, ix});
    }
    metaIdx[ix] = {e, meta};
  }
}

// ---------- seleccion ----------
const selected = new Set();
const selListEl = document.getElementById('selList');
const countEl = document.getElementById('count');
function renderList() {
  selListEl.innerHTML = '';
  const ids = [...selected].sort((a,b)=>a-b);
  ids.forEach(ix => {
    const m = metaIdx[ix];
    if (!m) return;
    const div = document.createElement('div');
    const rm = document.createElement('span');
    rm.className = 'rm'; rm.textContent = 'x'; rm.title = 'Quitar';
    rm.onclick = () => { selected.delete(ix); buildDeformada(); renderList(); };
    div.appendChild(rm);
    div.appendChild(document.createTextNode(
      '#' + m.meta.id + '  ' + m.e.type + '  ' + (m.e.section||'') + '  ni=' + m.meta.ni + ' nj=' + m.meta.nj
    ));
    selListEl.appendChild(div);
  });
  countEl.textContent = ids.length;
}
function copySel() {
  const out = [...selected].map(ix => {
    const m = metaIdx[ix];
    const D = ANALYSIS.disp[S.caso];
    return { id: m.meta.id, type: m.e.type, section: m.e.section, ni: m.meta.ni, nj: m.meta.nj,
             longitud: Math.hypot(m.e.xj-m.e.xi, m.e.yj-m.e.yi, m.e.zj-m.e.zi).toFixed(3) };
  });
  navigator.clipboard.writeText(JSON.stringify(out, null, 2)).then(
    () => alert('Copiado al portapapeles: ' + out.length + ' elementos'),
    () => alert('No se pudo copiar; usa Descargar')
  );
}
function downloadSel() {
  const out = [...selected].map(ix => {
    const m = metaIdx[ix];
    return { id: m.meta.id, type: m.e.type, section: m.e.section, ni: m.meta.ni, nj: m.meta.nj };
  });
  const blob = new Blob([JSON.stringify(out, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'seleccion_vigas_sospechosas.json';
  a.click();
}
function clearSel() { selected.clear(); buildDeformada(); renderList(); }

// ---------- raycast ----------
const raycaster = new THREE.Raycaster();
const mouseNdc = new THREE.Vector2();
renderer.domElement.addEventListener('click', ev => {
  mouseNdc.x = (ev.clientX / window.innerWidth) * 2 - 1;
  mouseNdc.y = -(ev.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouseNdc, camera);
  const hits = raycaster.intersectObjects(defMeshes.map(m => m.mesh), false);
  if (hits.length) {
    const ix = hits[0].object.userData.ix;
    if (selected.has(ix)) selected.delete(ix); else selected.add(ix);
    buildDeformada();
    renderList();
  }
});

// hover info
renderer.domElement.addEventListener('mousemove', ev => {
  mouseNdc.x = (ev.clientX / window.innerWidth) * 2 - 1;
  mouseNdc.y = -(ev.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouseNdc, camera);
  const hits = raycaster.intersectObjects(defMeshes.map(m => m.mesh), false);
  const el = document.getElementById('hoverInfo');
  if (hits.length) {
    const u = hits[0].object.userData;
    const D = ANALYSIS.disp[S.caso];
    const m = metaIdx[u.ix];
    const di = D[m.meta.ni]||[0,0,0,0,0,0];
    const dj = D[m.meta.nj]||[0,0,0,0,0,0];
    el.textContent = '#' + u.id + ' ' + u.type + ' ' + (u.section||'') +
      '  ni=' + m.meta.ni + ' (' + (di[0]*1000).toFixed(2) + ',' + (di[1]*1000).toFixed(2) + ') mm' +
      '  nj=' + m.meta.nj + ' (' + (dj[0]*1000).toFixed(2) + ',' + (dj[1]*1000).toFixed(2) + ') mm';
  } else {
    el.textContent = 'Hover sobre un elemento para ver su id';
  }
});

// ---------- controles orbit ----------
let isRotating = false, isPanning = false;
let prevMouse = {x:0,y:0};
const spherical = new THREE.Spherical().setFromVector3(
  new THREE.Vector3().subVectors(camera.position, ORBIT_TARGET));
renderer.domElement.addEventListener('mousedown', e => {
  if (e.button === 0) isRotating = true;
  if (e.button === 2) isPanning = true;
  prevMouse = {x: e.clientX, y: e.clientY};
});
renderer.domElement.addEventListener('mouseup', () => { isRotating = false; isPanning = false; });
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
renderer.domElement.addEventListener('mousemove', ev => {
  if (!isRotating && !isPanning) return;
  const dx = ev.clientX - prevMouse.x, dy = ev.clientY - prevMouse.y;
  prevMouse = {x: ev.clientX, y: ev.clientY};
  if (isRotating) {
    spherical.theta -= dx * 0.01;
    spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi - dy * 0.01));
    camera.position.copy(ORBIT_TARGET).add(new THREE.Vector3().setFromSpherical(spherical));
    camera.lookAt(ORBIT_TARGET);
  }
  if (isPanning) {
    const wdir = new THREE.Vector3(); camera.getWorldDirection(wdir);
    const right = new THREE.Vector3().crossVectors(camera.up, wdir).normalize();
    camera.position.addScaledVector(right, -dx * 0.02);
    camera.position.addScaledVector(camera.up, dy * 0.02);
  }
});
renderer.domElement.addEventListener('wheel', e => {
  spherical.radius = Math.max(2, Math.min(100, spherical.radius + e.deltaY * 0.02));
  camera.position.copy(ORBIT_TARGET).add(new THREE.Vector3().setFromSpherical(spherical));
  camera.lookAt(ORBIT_TARGET);
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- eventos panel ----------
selCaso.addEventListener('change', () => { S.caso = selCaso.value; buildDeformada(); });
document.getElementById('rngFac').addEventListener('input', e => {
  S.factor = +e.target.value;
  document.getElementById('facVal').textContent = S.factor + 'x';
  buildDeformada();
});
['tg-col','tg-bx','tg-by','tg-wall'].forEach(id => {
  document.getElementById(id).addEventListener('change', buildDeformada);
});
function switchMode() {
  S.showRef = !S.showRef;
  refGroup.visible = S.showRef;
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
buildDeformada();
renderList();
animate();
</script>
</body>
</html>
